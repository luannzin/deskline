name: ci

# Tests on every push and pull request, on each platform Deskline ships for.
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Debian 12: the oldest glibc (2.36) and PipeWire (0.3.65, what the pipewire crate
          # needs) the .deb supports
          - os: ubuntu-latest
            container: debian:12
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies and Rust (Linux)
        if: runner.os == 'Linux'
        run: |
          tools/install-linux-deps.sh
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup update stable --no-self-update && rustup default stable

      # nasm: the fast H.264 encoder
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - if: runner.os == 'macOS'
        run: brew install nasm

      - uses: Swatinem/rust-cache@v2
      - run: cargo test
