[package]
name = "deskline"
# Bumping this and pushing to main publishes release v<version> (.github/workflows/release.yml),
# which installed copies then update to.
version = "0.8.0"
edition = "2024"
description = "Remote desktop with no server: share a code, accept, see and control the other screen."

[dependencies]
anyhow = "1"
# Clipboard sync. On Linux the data-control protocol lets a window that doesn't have focus see
# changes (KDE, wlroots; GNOME falls back to X11/XWayland).
arboard = "3.7"
# The unattended-access password is stored as an Argon2 hash.
argon2 = "0.6"
# Sound devices: WASAPI (with loopback) on Windows, CoreAudio on macOS, ALSA on Linux (playback
# only; capture there is PipeWire). Linux builds need libasound2-dev.
cpal = "0.18"
# glow (OpenGL) instead of wgpu: smaller binary, faster build, runs on old GPUs and VMs.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
# Tray icons are pngs in assets/.
image = { version = "0.25", default-features = false, features = ["png"] }
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
# Builds Cisco's OpenH264 from source into the binary: nothing to install next to the app.
openh264 = "0.9"
# The raw option ids for changing the bitrate mid-stream; the same crate openh264 builds.
openh264-sys2 = { version = "0.9", default-features = false }
postcard = { version = "1", features = ["use-std"] }
# Native file pickers for file transfer (xdg portal on Linux, no GTK).
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The interface speaks English or Portuguese, from the system language.
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# Linux uses the pure-Rust StatusNotifierItem backend: no GTK to install or link.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# Opus for the host's sound: libopus 1.3.1 translated to Rust. No C compiler or CMake, so it
# builds the same everywhere, the mingw cross build included.
unsafe-libopus = "0.2"
# Update checks and downloads from GitHub Releases; rustls so no OS TLS library is needed.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Linux: the xdg RemoteDesktop/ScreenCast portals with PipeWire for the frames (GNOME, KDE,
# wlroots), Wayland virtual input on wlroots, and X11 directly elsewhere. Building needs
# libpipewire-0.3-dev 0.3.65+ (Debian 12, Ubuntu 24.04) and libclang-dev.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["remote_desktop", "screencast"] }
# The GPU's H.264 encoder (and decoder): NVENC or VA-API, through GStreamer's elements, which
# also scale and convert on the GPU. Building needs libgstreamer1.0-dev and
# libgstreamer-plugins-base1.0-dev; at runtime the encoders come from gstreamer1.0-plugins-bad
# (or gstreamer1.0-vaapi), and without them OpenH264 encodes as before.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
libc = "0.2"
pipewire = "0.10"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes", "xtest"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Service install and the sign-in Run key.
windows-registry = "0.6"

# macOS: CoreGraphics display streams for the frames and CGEvent for input. The same versions
# eframe already pulls in, so nothing new gets downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2",
    "objc2-io-surface",
    "CGDirectDisplay",
    "CGDisplayStream",
    "CGError",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGWindow",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "objc2", "IOSurfaceRef", "IOSurfaceTypes", "libc"] }

# Icon and version info in the .exe (build.rs).
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The encoder is C and the color conversion is hot Rust: unoptimized they can't keep up, even
# in debug builds.
[profile.dev.package."*"]
opt-level = 3
